query Catalog {
  catalog {
    artists {
      name
      slug
      songCount
    }
    genres {
      name
      slug
      songCount
    }
  }
}

query Songs($search: String, $artist: String, $genre: String, $limit: Int, $offset: Int) {
  songs(search: $search, artist: $artist, genre: $genre, limit: $limit, offset: $offset) {
    totalCount
    hasNextPage
    songs {
      id
      title
      artist
      genre
      overallFlowRating
      timeToFlowSeconds
    }
  }
}

query SongDetail($slug: ID!) {
  song(slug: $slug) {
    id
    title
    artist
    description
    links {
      label
      url
    }
    triggers {
      timestamp
      title
      description
    }
    reports {
      id
      contributor
      overallFlowRating
      timeToFlowSeconds
    }
  }
}
