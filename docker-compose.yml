services:
  graphql:
    build:
      context: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      SONG_ENTRY_WRITE_TOKEN: ${SONG_ENTRY_WRITE_TOKEN:-}
    volumes:
      - music-data:/app/music
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  music-data:
